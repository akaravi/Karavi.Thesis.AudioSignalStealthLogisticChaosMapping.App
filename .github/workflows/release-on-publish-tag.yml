# Release on tag publish* — runs on self-hosted Windows (no GitHub-hosted billing).
# Before first tag push: register runner + set repo variable SELF_HOSTED_RUNNER_READY=true
# See: scripts/ci/Enable-ReleaseWorkflowRepository.ps1

name: Release on publish tag

on:
  push:
    tags:
      - publish
      - publish/**
      - publish-*
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. publish or publish/1.0.0+1)"
        type: string
        required: true
        default: publish
      skip_tests:
        description: "Skip dotnet/flutter tests (faster CI)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-release:
    # Avoid infinite "Waiting for a runner" when self-hosted is not registered yet.
    if: github.event_name == 'workflow_dispatch' || vars.SELF_HOSTED_RUNNER_READY == 'true'
    runs-on: self-hosted
    timeout-minutes: 180

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: meta
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "RELEASE_TAG is empty."
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          Write-Host "Release tag: $tag"

      - name: Prepare Android signing
        shell: pwsh
        run: ./scripts/ci/Prepare-AndroidReleaseSigning.ps1 -AndroidRoot ./src/audio_steg_app/android
        continue-on-error: true

      - name: Verify toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          dotnet --version
          if ($LASTEXITCODE -ne 0) { throw "dotnet not on PATH" }
          flutter --version
          if ($LASTEXITCODE -ne 0) { throw "flutter not on PATH" }
          if (-not $env:ANDROID_HOME -and -not $env:ANDROID_SDK_ROOT) {
            Write-Warning "ANDROID_HOME / ANDROID_SDK_ROOT not set — Android build may fail."
          }

      - name: Build all release artifacts
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          $tag = '${{ steps.meta.outputs.tag }}'
          $skipTests = $true
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $skipTests = '${{ github.event.inputs.skip_tests }}' -eq 'true'
          }
          $buildArgs = @{
            TagName            = $tag
            AndroidArtifact    = 'Both'
            SkipFlutterAnalyze = $true
          }
          if ($skipTests) { $buildArgs.SkipTests = $true }
          .\_build-github-release.ps1 @buildArgs

      - name: Upload GitHub Release assets
        shell: pwsh
        run: |
          ./scripts/ci/Invoke-WorkflowReleaseUpload.ps1 -TagName '${{ steps.meta.outputs.tag }}'
