# Push tag "publish" (or publish/1.0.0+2, publish-v1.0.0, …) → build all platforms → GitHub Release.
# Local dry-run: .\_build-github-release.ps1 -TagName publish

name: Release on publish tag

on:
  push:
    tags:
      - publish
      - publish**
      - publish-*

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Java (Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          if ([string]::IsNullOrWhiteSpace($sdk)) { $sdk = $env:ANDROID_SDK_ROOT }
          $sm = Join-Path $sdk "cmdline-tools\latest\bin\sdkmanager.bat"
          if (Test-Path $sm) {
            1..50 | ForEach-Object { "y" } | & $sm --licenses 2>&1 | Out-Host
          }
          flutter doctor -v

      - name: Flutter precache (android, windows, web)
        shell: pwsh
        working-directory: src/audio_steg_app
        run: |
          flutter precache --android --windows --web

      - name: Build all release artifacts
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          $tag = "${{ github.ref_name }}"
          Write-Host "Building release for tag: $tag"
          .\_build-github-release.ps1 -TagName $tag -AndroidArtifact Both

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            publish/github-release/*.zip
            publish/github-release/*.apk
            publish/github-release/*.aab
            publish/github-release/RELEASE_MANIFEST.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
