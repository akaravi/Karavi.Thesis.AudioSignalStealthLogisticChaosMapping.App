<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LastRunInfo - Audio Stegano</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --text: #1a1d21;
      --muted: #5c6570;
      --border: #d8dee4;
      --accent: #0d7a7c;
      --ok: #1b7f3a;
      --fail: #c62828;
      --warn: #b26a00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121416;
        --surface: #1c1f24;
        --text: #e8eaed;
        --muted: #9aa3ad;
        --border: #2f363d;
        --accent: #4fd1d4;
        --ok: #6fcf97;
        --fail: #f28b82;
        --warn: #f4c430;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 1.5rem;
    }
    main { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 0.25rem; color: var(--accent); }
    .meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .badge.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
    .badge.fail { background: color-mix(in srgb, var(--fail) 18%, transparent); color: var(--fail); }
    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.25rem;
    }
    h2 { font-size: 1.1rem; margin: 0 0 0.75rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th, td { text-align: right; padding: 0.5rem 0.65rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    td.ok { color: var(--ok); font-weight: 600; }
    td.fail { color: var(--fail); font-weight: 600; }
    td.warn { color: var(--warn); font-weight: 600; }
    td.muted { color: var(--muted); }
    a { color: var(--accent); word-break: break-all; }
    code { font-size: 0.88em; }
  </style>
</head>
<body>
  <main>
    <h1>آخرین اجرای لوکال</h1>
    <p class="meta">
      __SUMMARY__<br>
      اسکریپت: <code>__INVOKED_BY__</code> —
      زمان: <code>__GENERATED_AT__</code> —
      وضعیت کلی: __OVERALL_BADGE__
    </p>

    <section>
      <h2>نتیجه اجرا</h2>
      <table>
        <thead>
          <tr><th>مرحله</th><th>وضعیت</th><th>جزئیات</th></tr>
        </thead>
        <tbody>
__RESULT_ROWS__
        </tbody>
      </table>
    </section>

    <section>
      <h2>آدرس‌های سرویس</h2>
      <table>
        <thead>
          <tr><th>سرویس</th><th>آدرس</th><th>توضیح</th></tr>
        </thead>
        <tbody>
__SERVICE_ROWS__
        </tbody>
      </table>
    </section>

    <section>
      <h2>تخصیص پورت‌ها (5320–5329)</h2>
      <table>
        <thead>
          <tr><th>نام</th><th>پورت</th><th>کاربرد</th></tr>
        </thead>
        <tbody>
__PORT_ROWS__
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
